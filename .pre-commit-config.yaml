repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.8 # also update constraints.txt
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format

- repo: local
  hooks:
    - id: integrity-check
      name: project integrity tests
      entry: .venv/bin/python3 -m pytest test/integrity/
      language: system
      pass_filenames: false
      always_run: true
